name: Run Shortcut to Google Sheets

on:
  schedule:
    - cron: '0 22 * * *' # 23:00 CET (22:00 UTC)
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read
  id-token: write # OIDC for AWS SSM (LINEAR_API_KEY)

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::388073764231:role/GitHubRunner_gha-bug-tracker
          aws-region: eu-central-1

      - name: Load Linear API key from SSM
        run: |
          linear=$(aws ssm get-parameter --region eu-west-1 --with-decryption --name /CI/GHA/LINEAR_API_KEY --query 'Parameter.Value' --output text)
          echo "::add-mask::$linear"
          echo "LINEAR_API_TOKEN=$linear" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '23.1.0'

      - name: Install dependencies
        run: npm install

      - name: Create Google credentials file
        run: echo $GOOGLE_CREDENTIALS_BASE64 | base64 --decode > google-credentials.json
        env:
          GOOGLE_CREDENTIALS_BASE64: ${{ secrets.GOOGLE_CREDENTIALS_BASE64 }}

      - name: Compile TypeScript
        run: npm run build

      - name: Run script
        run: node dist/script.js
        env:
          SHORTCUT_API_TOKEN: ${{ secrets.SHORTCUT_API_TOKEN }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          GOOGLE_CREDENTIALS_BASE64: ${{ secrets.GOOGLE_CREDENTIALS_BASE64 }}